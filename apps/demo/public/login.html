<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Login</title>
    <link rel="stylesheet" href="/public/styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <div>
          <span class="badge">Cypress Demo</span>
          <h1>Entrar</h1>
        </div>
      </header>
      <form data-cy="login-form">
        <div>
          <label for="email">Email</label>
          <input
            data-cy="login-email"
            type="email"
            id="email"
            name="email"
            placeholder="ada@example.com"
            required
          />
        </div>
        <div>
          <label for="password">Senha</label>
          <input
            data-cy="login-password"
            type="password"
            id="password"
            name="password"
            placeholder="cypress123"
            required
          />
        </div>
        <button data-cy="login-submit" type="submit">Entrar</button>
        <p data-cy="login-error" class="error" hidden></p>
      </form>
    </main>
    <script src="/public/app.js"></script>
  </body>
</html>
